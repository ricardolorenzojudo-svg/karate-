<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karate Do Shotokan · Ricardo Lorenzo</title>
<style>
  body{background:#120d0d;color:#f0e8e8;font-family:system-ui,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .card{background:#211616;padding:2rem;border-radius:16px;text-align:center;max-width:420px}
</style>
</head>
<body>
<div class="card">
  <h1>🥋 Karate Do Shotokan</h1>
  <p id="estado">Conectando con el dojo…</p>
</div>
<script>
// Lee la "URL del dia" desde url.json (con anti-caché) y redirige al portal de n8n
fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
  .then(function (data) {
    if (data && data.url) { location.replace(data.url); }
    else { fallo(); }
  })
  .catch(fallo);

function fallo() {
  document.getElementById('estado').innerHTML =
    'No se pudo obtener la dirección del dojo.<br>Consulte al sensei.';
}
</script>
</body>
</html>
